<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Settings</title>

    <link rel="icon" href="{{ url_for('static', filename='img/favicon.ico') }}" type="image/x-icon">

    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/settings.style.css') }}">
</head>
<body>
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card">
                    <div class="card-header">
                        Settings
                        <button id="theme-toggle" class="btn btn-outline-secondary btn-sm float-right">
                            <i class="fas fa-moon"></i> Toggle Dark Mode
                        </button>                        
                    </div>

                    <div class="card-body">
                        {% with messages = get_flashed_messages(with_categories=true) %}
                            {% if messages %}
                                <div id="flash-messages">
                                    {% for category, message in messages %}
                                        <div class="alert alert-{{ category }} alert-dismissible fade show" role="alert">
                                            {{ message }}
                                            <button type="button" class="close" data-dismiss="alert" aria-label="Close">
                                                <span aria-hidden="true">×</span>
                                            </button>
                                        </div>
                                    {% endfor %}
                                </div>
                            {% endif %}
                        {% endwith %}

                        <a href="{{ url_for('index') }}" class="btn btn-secondary">Back</a>

                        <div class="card mb-3 mt-3">
                            <div class="card-header">Change Username</div>
                            <div class="card-body">
                                <form id="changeUsernameForm">
                                    <div class="form-group">
                                        <input type="text" class="form-control" id="newUsername" name="new_username" placeholder="New Username" required>
                                    </div>
                                    <button type="submit" class="btn btn-primary">Change Username</button>
                                </form>
                            </div>
                        </div>

                        <div class="card mb-3">
                            <div class="card-header">Change Password</div>
                            <div class="card-body">
                                <form id="changePasswordForm">
                                    <div class="form-group">
                                        <input type="password" class="form-control" id="newPassword" name="new_password" placeholder="New Password" required>
                                    </div>
                                    <button type="submit" class="btn btn-primary">Change Password</button>
                                </form>
                            </div>
                        </div>

                        <div class="card mb-3">
                            <div class="card-header">Check for Updates</div>
                            <div class="card-body">
                                <button id="checkUpdateBtn" class="btn btn-info">Check Update</button>
                                <div id="updateStatus" class="mt-3"></div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="footer">
        <div id="version-info">
            <span>Version {{ version }}</span>
            <span> | </span>
            <a href="https://github.com/AbolDev/File-Manager" target="_blank" rel="noopener noreferrer">
                <i class="fab fa-github"></i> GitHub
            </a>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.bundle.min.js"></script>
    <script>
        $(document).ready(function() {
            var themeToggle = $('#theme-toggle');
            var isDarkMode = localStorage.getItem('darkMode') === 'true';

            function enableDarkMode() {
                $('body').addClass('dark-mode');
                themeToggle.html('<i class="fas fa-sun"></i> Toggle Light Mode');
                localStorage.setItem('darkMode', 'true');
            }

            function disableDarkMode() {
                $('body').removeClass('dark-mode');
                themeToggle.html('<i class="fas fa-moon"></i> Toggle Dark Mode');
                localStorage.setItem('darkMode', 'false');
            }

            if (isDarkMode) {
                enableDarkMode();
            }

            themeToggle.on('click', function() {
                if ($('body').hasClass('dark-mode')) {
                    disableDarkMode();
                } else {
                    enableDarkMode();
                }
            });

            $('#changeUsernameForm').on('submit', function(event) {
                event.preventDefault();
                var newUsername = $('#newUsername').val();
                $.ajax({
                    type: 'POST',
                    url: '/api/change-username',
                    data: { new_username: newUsername },
                    success: function(response) {
                        alert(response.message);
                        location.reload();
                    },
                    error: function(xhr) {
                        alert('Error: ' + xhr.responseJSON.error);
                    }
                });
            });

            $('#changePasswordForm').on('submit', function(event) {
                event.preventDefault();
                var newPassword = $('#newPassword').val();
                $.ajax({
                    type: 'POST',
                    url: '/api/change-password',
                    data: { new_password: newPassword },
                    success: function(response) {
                        alert(response.message);
                        location.reload();
                    },
                    error: function(xhr) {
                        alert('Error: ' + xhr.responseJSON.error);
                    }
                });
            });

            $('#checkUpdateBtn').on('click', function() {
                $('#updateStatus').html('<div class="alert alert-info">Checking for updates...</div>');
                $.ajax({
                    type: 'GET',
                    url: '/api/check-update',
                    success: function(response) {
                        if (response.update_available) {
                            $('#updateStatus').html(`
                                <div class="alert alert-warning">
                                    Update available! Current version: {{ version }}, Latest version: ${response.latest_version}.
                                    <button id="applyUpdateBtn" class="btn btn-success btn-sm ml-2">Apply Update</button>
                                </div>
                            `);
                            $('#applyUpdateBtn').on('click', function() {
                                if (confirm('Are you sure you want to update the File Manager? This will replace all files and restart the application.')) {
                                    $('#updateStatus').html('<div class="alert alert-info">Updating File Manager... Please wait for the page to reload.</div>');
                                    $.ajax({
                                        type: 'POST',
                                        url: '/api/apply-update',
                                        success: function(response) {
                                            $('#updateStatus').html('<div class="alert alert-success">Update started! Reloading page...</div>');
                                            setTimeout(function() {
                                                location.reload();
                                            }, 3000);
                                        },
                                        error: function(xhr) {
                                            if (xhr.status === 405) {
                                                $('#updateStatus').html('<div class="alert alert-success">Update successful! Reloading page...</div>');
                                                setTimeout(function() {
                                                    location.reload();
                                                }, 3000);
                                            } else {
                                                $('#updateStatus').html(`<div class="alert alert-danger">Failed to start update: ${xhr.responseJSON ? xhr.responseJSON.error : 'Unknown error'}</div>`);
                                            }
                                        }
                                    });
                                }
                            });
                        } else {
                            $('#updateStatus').html('<div class="alert alert-success">You are using the latest version: {{ version }}</div>');
                        }
                    },
                    error: function(xhr) {
                        $('#updateStatus').html(`<div class="alert alert-danger">Error checking update: ${xhr.responseJSON ? xhr.responseJSON.error : 'Unknown error'}</div>`);
                    }
                });
            });
        });
    </script>
</body>
</html>
